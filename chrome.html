<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--cy:#5ff2ff;--cy2:#2bb6d8;--am:#ffb64d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#04070c;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#d8f4fb}
body{position:relative}
#bg{position:fixed;inset:0;background:
 radial-gradient(1200px 800px at 50% 42%,rgba(30,90,120,.28),transparent 70%),
 radial-gradient(900px 700px at 85% 90%,rgba(20,60,90,.18),transparent 70%),
 #04070c}
#grid{position:fixed;inset:0;opacity:.10;background-image:
 linear-gradient(rgba(95,242,255,.35) 1px,transparent 1px),
 linear-gradient(90deg,rgba(95,242,255,.35) 1px,transparent 1px);
 background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 75%)}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#orbwrap{position:relative;width:min(52vmin,520px);height:min(52vmin,520px)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:fixed;top:26px;left:34px;z-index:5}
#hud h1{font-size:30px;letter-spacing:.55em;font-weight:300;color:#eaffff;text-shadow:0 0 18px rgba(95,242,255,.8);margin-right:-.55em}
#status{margin-top:8px;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--cy);opacity:.9}
#ring2{position:fixed;top:26px;right:34px;text-align:right;font-size:11px;letter-spacing:.2em;color:rgba(216,244,251,.55);z-index:5;line-height:1.9}
#log{position:fixed;left:0;right:0;bottom:96px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 20px;overflow:hidden}
.msg{max-width:760px;width:fit-content;padding:12px 20px;border-radius:14px;font-size:15.5px;line-height:1.55;backdrop-filter:blur(6px);opacity:0;transform:translateY(8px);transition:all .35s}
.msg.show{opacity:1;transform:none}
.msg.you{background:rgba(95,242,255,.07);border:1px solid rgba(95,242,255,.25);align-self:center}
.msg.jarvis{background:rgba(10,30,40,.55);border:1px solid rgba(95,242,255,.18);color:#eaffff;max-width:820px}
#mic{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:6;width:64px;height:64px;border-radius:50%;border:1px solid rgba(95,242,255,.45);background:rgba(8,20,28,.6);color:var(--cy);font-size:26px;cursor:pointer;transition:all .25s;box-shadow:0 0 24px rgba(95,242,255,.15)}
#mic:hover{background:rgba(95,242,255,.15)}
#mic.on{background:rgba(95,242,255,.25);box-shadow:0 0 42px rgba(95,242,255,.45)}
#gear{position:fixed;bottom:34px;right:30px;z-index:6;width:44px;height:44px;border-radius:50%;border:1px solid rgba(95,242,255,.25);background:rgba(8,20,28,.6);color:rgba(216,244,251,.7);font-size:18px;cursor:pointer}
#hint{position:fixed;bottom:88px;left:30px;z-index:6;font-size:11.5px;color:rgba(216,244,251,.45);letter-spacing:.06em}
#typein{position:fixed;bottom:34px;left:30px;z-index:6;width:min(400px,38vw);padding:11px 16px;border-radius:12px;border:1px solid rgba(95,242,255,.3);background:rgba(8,20,28,.7);color:#eaffff;font-size:14px;outline:none}
#setup{position:fixed;inset:0;z-index:20;background:rgba(2,5,9,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
#setup .card{width:min(520px,90vw);background:rgba(8,20,28,.85);border:1px solid rgba(95,242,255,.3);border-radius:18px;padding:36px 34px;box-shadow:0 0 60px rgba(95,242,255,.12)}
#setup h2{font-weight:300;letter-spacing:.4em;color:#eaffff;margin-bottom:6px}
#setup p{font-size:13.5px;color:rgba(216,244,251,.7);line-height:1.6;margin:14px 0}
#setup a{color:var(--cy)}
#setup input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(95,242,255,.35);background:rgba(0,10,16,.7);color:#eaffff;font-size:14px;outline:none}
#setup .row{display:flex;gap:10px;margin-top:18px}
#setup button{flex:1;padding:12px;border-radius:10px;border:1px solid rgba(95,242,255,.4);background:rgba(95,242,255,.12);color:#eaffff;font-size:14px;letter-spacing:.1em;cursor:pointer}
#setup button.ghost{background:transparent;color:rgba(216,244,251,.6)}
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div>
<div id="hud"><h1>JARVIS</h1><div id="status">initializing</div></div>
<div id="ring2"><div id="clock"></div><div id="date"></div></div>
<div id="stage"><div id="orbwrap"><canvas id="orb"></canvas></div></div>
<div id="log"></div>
<button id="mic" title="talk">🎙</button>
<button id="gear" title="setup">⚙</button>
<div id="hint">say "hey jarvis", click the mic, or type below</div>
<input id="typein" placeholder="type a command, sir…" spellcheck="false" autocomplete="off">
<div id="setup" style="display:none">
 <div class="card">
  <h2>JARVIS</h2>
  <p>Give me a brain. Paste a free <a href="https://aistudio.google.com" target="_blank">Google AI Studio</a> key and I run on real AI, with memory and the butler attitude. It stays on this computer.</p>
  <input id="keyin" placeholder="AI Studio API key" spellcheck="false">
  <div class="row"><button id="savekey">ACTIVATE</button><button id="skipkey" class="ghost">use built-ins only</button></div>
 </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const LS={key:'jarvis_key',mem:'jarvis_mem',hist:'jarvis_hist',wake:'jarvis_wake'};
const st={mode:'idle',key:localStorage.getItem(LS.key)||'',speaking:false,wantSr:true,sr:null,restarts:0};

/* ---------- orb ---------- */
const cv=$('orb'),cx=cv.getContext('2d');let W=0,H=0,t=0;
function fit(){const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;W=w;H=h;cx.setTransform(r,0,0,r,0,0)}
addEventListener('resize',fit);fit();
const P=[];for(let i=0;i<110;i++){P.push({a:Math.random()*Math.PI*2,r:.42+Math.random()*.58,s:.0015+Math.random()*.004,z:Math.random()*2-1,tw:Math.random()*6.28})}
const arcs=[{r:.62,sp:.0035,w:2,a0:0,a1:1.5},{r:.78,sp:-.0022,w:1.2,a0:2.2,a1:1.9},{r:.9,sp:.0016,w:.8,a0:4.4,a1:2.4}];
let ripples=[];
function pulse(n){for(let i=0;i<(n||1);i++)ripples.push({r:.3,a:.8,v:.006+Math.random()*.004})}
function draw(){
 t++;cx.clearRect(0,0,W,H);
 const cxp=W/2,cyp=H/2,R=Math.min(W,H)*.5;
 const speaking=st.speaking,listening=st.mode==='listening'||st.mode==='wakeopen';
 const hot=speaking?[255,182,77]:[95,242,255];
 const col=(a)=>`rgba(${hot[0]},${hot[1]},${hot[2]},${a})`;
 const beat=Math.sin(t*.06)*.5+.5;
 const breathe=speaking?(.75+beat*.35):listening?(.85+beat*.2):(.9+beat*.08);
 /* core */
 let g=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,R*.55);
 g.addColorStop(0,col(.9));g.addColorStop(.18,col(.5));g.addColorStop(.45,col(.14));g.addColorStop(1,'rgba(0,0,0,0)');
 cx.globalAlpha=.9*breathe;cx.fillStyle=g;cx.beginPath();cx.arc(cxp,cyp,R*.55,0,7);cx.fill();cx.globalAlpha=1;
 cx.beginPath();cx.arc(cxp,cyp,R*.2*breathe,0,7);cx.fillStyle=col(.85);cx.shadowColor=col(1);cx.shadowBlur=40;cx.fill();cx.shadowBlur=0;
 /* arcs */
 cx.lineCap='round';
 arcs.forEach(A=>{const rr=R*A.r;cx.strokeStyle=col(.5);cx.lineWidth=A.w;
  cx.beginPath();cx.arc(cxp,cyp,rr,A.a0+t*A.sp,A.a0+t*A.sp+A.a1);cx.stroke();
  cx.strokeStyle=col(.16);cx.lineWidth=A.w*.7;
  cx.beginPath();cx.arc(cxp,cyp,rr,A.a0+t*A.sp+Math.PI,A.a0+t*A.sp+Math.PI+A.a1*.6);cx.stroke()});
 /* particles */
 P.forEach(p=>{p.a+=p.s*(speaking?2.2:listening?1.6:1);
  const rr=R*p.r*(1+p.z*.06),x=cxp+Math.cos(p.a)*rr,y=cyp+Math.sin(p.a)*rr*.42,pz=(Math.sin(p.a)+1)/2;
  const al=(.25+.55*pz)*(.7+.3*Math.sin(t*.08+p.tw));
  cx.fillStyle=col(al);cx.beginPath();cx.arc(x,y,.8+pz*1.8,0,7);cx.fill()});
 /* speaking bars */
 if(speaking){const n=48;for(let i=0;i<n;i++){const a=i/n*7,h=R*(.12+.28*Math.abs(Math.sin(t*.35+i*1.7))*(.4+.6*Math.sin(t*.13+i)));
  const x1=cxp+Math.cos(a)*R*.58,y1=cyp+Math.sin(a)*R*.58;
  cx.strokeStyle=col(.4);cx.lineWidth=2;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(cxp+Math.cos(a)*(R*.58+h),cyp+Math.sin(a)*(R*.58+h*.5));cx.stroke()}}
 /* ripples */
 ripples=ripples.filter(rp=>rp.a>0);
 ripples.forEach(rp=>{rp.r+=rp.v;rp.a-=.016;cx.strokeStyle=col(rp.a*.7);cx.lineWidth=1.4;
  cx.beginPath();cx.ellipse(cxp,cyp,R*rp.r,R*rp.r*.42,0,0,7);cx.stroke()});
 /* outer haze */
 cx.strokeStyle=col(.1);cx.lineWidth=1;cx.beginPath();cx.arc(cxp,cyp,R*.99,0,7);cx.stroke();
 requestAnimationFrame(draw)}
draw();

/* ---------- speech out ---------- */
const voice=()=>{const v=speechSynthesis.getVoices();return v.find(x=>/UK English Male|Daniel|Google UK English Male/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||v[0]};
speechSynthesis.onvoiceschanged=()=>{};
function say(text,after){
 if(!text)return after&&after();
 srStop(true);st.speaking=true;setStatus('speaking');
 const chunks=text.match(/[^.!?]+[.!?]*|\S+$/g)||[text];let i=0;
 const nxt=()=>{if(i>=chunks.length){st.speaking=false;srStart();after&&after();return}
  const u=new SpeechSynthesisUtterance(chunks[i++].trim());
  u.voice=voice();u.rate=1.02;u.pitch=.92;
  u.onend=nxt;u.onerror=nxt;speechSynthesis.speak(u)};
 nxt()}

/* ---------- speech in ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function srStart(){
 if(!SR||st.speaking||!st.wantSr)return;
 if(!st.sr){st.sr=new SR();st.sr.continuous=true;st.sr.interimResults=true;st.sr.lang='en-US';
  st.sr.onresult=e=>{let fin='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)fin+=e.results[i][0].transcript;
   if(fin.trim())onHeard(fin.trim())};
  st.sr.onend=()=>{if(st.wantSr&&!st.speaking){try{st.sr.start()}catch(e){}}};
  st.sr.onerror=ev=>{const m=ev.error;if(m==='not-allowed'||m==='service-not-allowed'){st.wantSr=false;setStatus('mic blocked: click the icon left of the address bar, allow, then tap 🎙')}else if(m==='audio-capture'){st.wantSr=false;setStatus('no microphone found, sir')}else if(m==='network'){setStatus('speech service hiccup, retrying')}else{setStatus('mic: '+m+' — tap 🎙 to retry')}};
  try{st.sr.start()}catch(e){}}
 else try{st.sr.start()}catch(e){}}
function srStop(hard){try{st.sr&&st.sr.abort()}catch(e){}if(hard)st.sr=null}
function onHeard(txt){
 const wake=/(?:hey\s+)?jarvis/i;
 if(st.mode==='idle'){
  if(!wake.test(txt))return;
  const rest=txt.replace(/^.*?(?:hey\s+)?jarvis[:,]?\s*/i,'').trim();
  if(!rest){st.mode='listening';setStatus('yes, sir?');say(pick(['Yes, sir?','At your service, sir.','Standing by, sir.']));arm();return}
  st.mode='listening';handle(rest);arm();return}
 st.mode='listening';arm();handle(txt)}
let armT;function arm(){clearTimeout(armT);armT=setTimeout(()=>{if(st.mode!=='speaking')st.mode='idle';setStatus('standing by')},9000)}

/* ---------- brain ---------- */
const SYS=`You are JARVIS, an advanced AI butler with dry British wit, voiced to the user, whom you address as "sir". You are loyal, unflappable, quietly sarcastic, and extremely capable. Answers are SPOKEN aloud, so keep them short: 2-4 sentences unless the user asks for detail. Never use markdown, lists, or emojis. Never say you cannot browse or act beyond what you can do: you genuinely can run timers, take notes, do math, fetch weather, and open sites, and everything else you answer with your intelligence.`;
function mem(){try{return JSON.parse(localStorage.getItem(LS.mem)||'[]')}catch(e){return[]}}
function hist(){try{return JSON.parse(localStorage.getItem(LS.hist)||'[]')}catch(e){return[]}}
function pushHist(role,text){const h=hist();h.push({role,text});while(h.length>14)h.shift();localStorage.setItem(LS.hist,JSON.stringify(h))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function setStatus(s){$('status').textContent=s}
async function brain(q){
 if(!st.key){return pick(["Running on instinct alone at the moment, sir — activate my brain in setup and I'll be considerably more useful.","That one needs the full mind, sir. A free AI Studio key in setup and I'm yours."])}
 const m=mem().length?("\nThings the user asked me to remember: "+mem().join(' | ')):'';
 const contents=hist().map(h=>({role:h.role==='jarvis'?'model':'user',parts:[{text:h.text}]}));
 contents.push({role:'user',parts:[{text:q}]});
 try{
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(st.key),{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({systemInstruction:{parts:[{text:SYS+m}]},contents,generationConfig:{temperature:.9,maxOutputTokens:400}})});
  const d=await r.json();
  const out=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts.map(p=>p.text).join(' ');
  if(!out)throw new Error((d.error&&d.error.message)||'empty');
  return out.trim()}catch(e){return "My brain just refused that call, sir. If the key's gone stale, setup will take a fresh one."}}

/* ---------- built-ins ---------- */
function handle(q){
 pushHist('user',q);show(q,'you');
 const s=q.toLowerCase();
 /* remember / recall */
 let m=s.match(/remember (?:that )?(.+)/);
 if(m){const facts=mem();facts.push(m[1]);localStorage.setItem(LS.mem,JSON.stringify(facts));
  return out(`Noted and filed, sir. ${pick(["I shan't forget it.","Committed to memory.","Consider it done."])}`)}
 if(/what (?:do|have) you rememb/.test(s)){const f=mem();return out(f.length?("As it happens: "+f.slice(-6).join('; ')+'.'):"A blank slate so far, sir. Tell me to remember things and I will.")}
 /* timer */
 m=s.match(/(?:set|start|make) (?:a |an )?timer (?:for )?(\d+)\s*(second|minute|hour|sec|min)/);
 if(m){const n=+m[1],u=m[2],ms=n*(u[0]==='s'?1e3:u[0]==='m'?6e4:36e5);
  setTimeout(()=>{say(`Sir, your ${n} ${u}${n>1?'s':''} timer has elapsed.`)},ms);
  return out(`Timer set, sir. ${n} ${u}${n>1?'s':''}. I'll announce it.`)}
 /* math */
 m=q.replace(/what(?:'s| is)/,'').replace(/[?=]/g,'').trim();
 if(/^[\d\s+\-*/().%]+$/.test(m)&&/\d/.test(m)&&/[+\-*/]/.test(m)){try{const v=Function('return ('+m+')')();if(isFinite(v))return out('That comes to '+v+', sir.')}catch(e){}}
 /* weather */
 if(/weather|temperature|how (?:hot|cold)/.test(s)){
  if(!navigator.geolocation)return out("I'd need your location for that, sir, and this browser isn't offering it.");
  return navigator.geolocation.getCurrentPosition(async p=>{
   try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`);
    const d=await r.json();const c=d.current;
    const desc={0:'clear skies',1:'mostly clear',2:'partly cloudy',3:'overcast',45:'foggy',48:'foggy',51:'light drizzle',53:'drizzle',55:'drizzle',61:'light rain',63:'rain',65:'heavy rain',71:'light snow',73:'snow',75:'heavy snow',80:'showers',81:'showers',82:'heavy showers',95:'a thunderstorm',96:'a thunderstorm'}[c.weather_code]||'some weather';
    out(`Currently ${Math.round(c.temperature_2m)} degrees with ${desc}, sir. Dress accordingly.`)}
   catch(e){out("The weather service is ignoring me, sir. I'll try again shortly.")}},
   ()=>out("Location's off, sir. Grant it and I'll fetch the forecast."),{timeout:8000})}
 /* open sites */
 const sites={youtube:'https://youtube.com',google:'https://google.com',gmail:'https://mail.google.com',netflix:'https://netflix.com',spotify:'https://open.spotify.com',github:'https://github.com',maps:'https://maps.google.com',reddit:'https://reddit.com',instagram:'https://instagram.com',twitch:'https://twitch.tv',wikipedia:'https://wikipedia.org',amazon:'https://amazon.com',discord:'https://discord.com/app',chatgpt:'https://chatgpt.com'};
 for(const k in sites){if(new RegExp('\\b(?:open|go to|launch|bring up)\\b.*\\b'+k+'\\b|\\b'+k+'\\b\\s*(?:please|$)').test(s)){
  window.open(sites[k],'_blank');return out(pick([`Opening ${k}, sir.`,`Pulling up ${k} now.`,`${k.charAt(0).toUpperCase()+k.slice(1)}, as requested.`]))}}
 /* time & date */
 if(/\bwhat time\b|\bthe time\b/.test(s))return out('It is '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+', sir.');
 if(/\bwhat(?:'s| is) (?:the |today'?s )?date\b|\bwhat day is it\b/.test(s))return out('Today is '+new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+', sir.');
 /* coin/dice */
 if(/flip a coin/.test(s))return out(pick(['Heads, sir.','Tails, sir.']));
 if(/roll (?:a )?dice|roll a d6/.test(s))return out('A '+ (1+Math.floor(Math.random()*6)) +', sir.');
 /* joke */
 if(/tell me a joke|make me laugh/.test(s))return out(pick(['Why did the AI cross the road? To optimize the other side, sir.','I would tell you a UDP joke, sir, but you might not get it.','My humor module is fully operational, sir. Your mileage may vary.']));
 /* who are you */
 if(/who are you|what are you/.test(s))return out('JARVIS, sir. Your butler, your memory, and occasionally your conscience.');
 /* brain */
 setStatus('thinking');st.mode='thinking';
 brain(q).then(a=>out(a))}
function out(a){pushHist('jarvis',a);show(a,'jarvis');say(a)}
function show(t,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=t;$('log').appendChild(d);
 requestAnimationFrame(()=>d.classList.add('show'));
 while($('log').children.length>3)$('log').firstChild.remove()}

/* ---------- ui ---------- */
$('mic').onclick=()=>{st.wantSr=true;srStop(true);setTimeout(srStart,150);setStatus('mic on — say "hey jarvis"')};
$('gear').onclick=()=>{$('setup').style.display='flex';$('keyin').value=st.key};
$('typein').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('typein').value.trim()){const v=$('typein').value.trim();$('typein').value='';st.mode='listening';handle(v);arm()}});
$('savekey').onclick=()=>{st.key=$('keyin').value.trim();localStorage.setItem(LS.key,st.key);$('setup').style.display='none';
 say(st.key?'Excellent, sir. Full faculties restored.':'Very well, sir. Instinct mode it is.')};
$('skipkey').onclick=()=>{$('setup').style.display='none';say('As you wish, sir. Built-ins at the ready.')};
function clock(){$('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
 $('date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}
clock();setInterval(clock,10000);
/* boot */
setStatus('standing by');srStart();
say(pick(['Systems online. Good to see you again, sir.','At your service, sir. All systems nominal.','Online and standing by, sir.']));
</script>
</body>
</html>
